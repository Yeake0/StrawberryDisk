[package]
name = "mangodisk"
version.workspace = true
description = "MangoDisk cross-platform disk space manager"
authors = ["harry0703"]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "mangodisk_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = []
portable = []

[build-dependencies]
cc = "1"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
blake3 = "1"
log = "0.4.33"
mangodisk-core = { path = "crates/mangodisk-core" }
mangodisk-platform = { path = "crates/mangodisk-platform", features = ["linux-desktop-icons"] }
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-prevent-default = { version = "2.1", features = ["unstable-windows"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-store = "2.4.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2.4.1"
uuid = { version = "1.23.0", features = ["v4"] }
tokio = { version = "1", features = ["sync"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSFont", "NSFontDescriptor", "NSStatusItem", "NSStatusBarButton", "NSWindow", "NSButton", "NSControl", "NSView", "NSRunningApplication", "NSImage", "NSColor", "NSAttributedString", "NSStringDrawing", "NSGraphics", "NSAppearance", "NSAccessibilityProtocols", "block2"] }
icns = "0.4"
plist = "1.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61.3"
features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common"]
