[package]
name = "strawberrydisk-cli"
version.workspace = true
description = "StrawberryDisk command-line automation adapter"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "strawberrydisk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
env_logger = "0.11"
strawberrydisk-core = { path = "../strawberrydisk-core" }
strawberrydisk-platform = { path = "../strawberrydisk-platform" }
log = "0.4.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
