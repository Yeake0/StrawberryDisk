id = "system.error-reports"
schema_version = 3
rule_version = 2
platform = "windows"
category = "system"
risk = "safe"
default_selected = true
required_stopped_processes = []

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${local_app_data}/Microsoft/Windows/WER/ReportArchive"

[[roots]]
template = "${local_app_data}/Microsoft/Windows/WER/ReportQueue"

[[roots]]
template = "${local_app_data}/Microsoft/Windows/WER/Temp"

[matcher]
kind = "olderThan"
days = 7

[execution]
kind = "deleteMatchingContents"
requires_app_close = false

[verification]
lifecycle = "verified"
evidence = "Windows Error Reporting defines separate user and machine report stores; this rule targets only current-user ReportArchive, ReportQueue, and Temp files older than seven days and excludes machine-wide stores"
verified_at = "2026-09-28"
verified_platform = "windows"
references = ["https://learn.microsoft.com/en-us/windows/win32/api/werapi/ne-werapi-report_store_types"]
