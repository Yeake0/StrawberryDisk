# Notion's persistent offline page records remain in notion.db. This rule
# selects only the renderer partition's Service Worker response cache; it may
# need network access to repopulate after cleanup.
id = "app.notion-service-worker-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "application"
risk = "recoverable"
default_selected = false
recommended_selected = true
required_stopped_processes = ["Notion"]

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${application_support}/Notion/Partitions"
kind = "childDirectories"
include_all_children = true
suffixes = ["Service Worker/CacheStorage"]
verified_rebuildable = true

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Notion 7.34.0 created CacheStorage beside notion.db. Only response caches are selected; offline records, scripts, account data, and browser storage remain excluded. Responses may need re-download"
verified_at = "2026-09-26"
verified_platform = "macos"
references = [
  "https://www.notion.com/blog/how-we-made-notion-available-offline",
  "https://www.notion.com/help/use-pages-offline",
  "https://www.electronjs.org/docs/latest/api/session",
]
