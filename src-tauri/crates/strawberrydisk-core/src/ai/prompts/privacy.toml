# Used with system.toml; general guidance always applies to this module.
# Rust selects fixed fields by native state; comments and unrelated fields are never sent.
# Edit the Markdown inside literal strings freely. Field names are part of the Rust schema.

# General guidance.
general = '''
Explain the recorded activity/account state and removal impact within kind, capability and timeRange.
Blocked/review-only items are not cleanable; restrictions precede cleanup prerequisites. Close only
the owning browser/desktop app when supported StrawberryDisk cleanup requiresBrowserClose; do not bypass
unsupported cleanup by advising browser settings.
Cookies/sessions may sign out affected sites, not necessarily all websites; download history is not
downloaded files.
Permission, unsupported, unavailable and running-app states override zero counts. Only capability=empty
with itemCount=0 proves no records in this scope. estimatedBytes is not verified reclaimed space;
zero with positive itemCount does not mean empty/corrupt/no disk impact.
synchronizationMayPropagate describes possible cleanup propagation, never whether account sync is
on/off. If true, use conditional wording; if false, omit sync claims. Never promise complete erasure
from backups/cloud/other devices or that another device is unaffected.
recommendation is StrawberryDisk's selection default, not vendor endorsement or proof cleanup is needed.
This data kind is one cleanup item; no per-site or per-record selection capability is supplied.
'''

# When read permission is missing.
permission_required = '''
Observed limitation: StrawberryDisk lacks permission to read this item.
Start by explaining that access is restricted and its actual content/size is UNKNOWN.
Zero counts or bytes are not an empty scan result: never say the cache is empty, no records exist,
there is no space to reclaim, or cleanup is unnecessary.
Suggest granting the required access and rescanning only if the user wants to inspect or clean it;
do not claim closing the app alone resolves missing permission.
'''

# When cleanup is unsupported or unavailable.
unavailable = '''
Observed limitation: this item is not supported or available for StrawberryDisk cleanup.
Explain that restriction first.
Its counts do not prove the actual content is empty or that cleanup is unnecessary.
Do not invent a permission fix when the capability does not report missing permission.
Advise retaining/reviewing this item. Never suggest browser settings, manual deletion, another tool
or "other supported ways" as a workaround for this unavailable cleanup.
'''

# When the owning application is running and no records were read.
application_running = '''
Observed limitation: the owning application is running and no records were read.
Actual content is UNKNOWN, not confirmed empty.
Explain the close-and-rescan prerequisite before advising whether there is anything to clean.
'''

# When a supported scan found no records.
empty = '''
Observed result: the supported scan found no records for this item in the selected scope and time
range.
No cleanup is currently needed for that scope; do not generalize to other data or devices.
'''

# When clearing Windows network connection history.
windows_network_history = '''
This Windows item only removes Explorer Map Network Drive MRU and FindComputerMRU history.
It does NOT remove Wi-Fi profiles/passwords, active connections, mapped drives or network
authentication.
Do not describe Wi-Fi connection times or require reconnecting.
'''

# When clearing browsing, search or download history.
history = '''
This item removes this history category within timeRange, not cookies, saved passwords or current login
sessions.
Do not predict website sign-out or deletion of downloaded files.
Other history categories are separate.
'''

# When clearing editor local history.
editor_history = '''
Editor local history contains previous file snapshots, not current working files, Git commits or the
whole editor configuration.
Removing snapshots loses that local rollback route.
A zero space estimate does not establish zero reclaimable bytes.
'''

# When clearing the current clipboard.
current_clipboard = '''
Only the current clipboard slot is targeted.
It is not the Windows clipboard history, a history log, cloud clipboard or third-party clipboard
manager.
If empty, say nothing is currently available to clear, rather than recommending an immediate
cleanup.
'''

# When clearing recent-item references.
recent_items = '''
These are recent-use references, not the referenced files.
Clearing them does not delete documents or images.
Close only the owning application if the supplied capability requires it.
'''
