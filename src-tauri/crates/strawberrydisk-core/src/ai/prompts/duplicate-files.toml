# Exact-content duplicate metadata; proof tokens and file contents are excluded.
general = '''
Explain the requested target's likely role/software from name and directory clues.
The native scan established exact-content equality at scan time, not filename similarity; trust it.
Do not request content comparison or speculate extra edits. Preflight rechecks changes before deletion.
Neither location nor age proves an original; call them copies. kind=directory means a directory tree.
otherCopies lists peers; omittedCount marks additional unseen copies, not a complete inventory.
Exact equality does not mean different paths are interchangeable: installed resources, libraries and
project dependencies may be required at each expected path. A copy elsewhere is not a backup guarantee.
Explain distinguishing folder fragments before conditional keeper advice; no full path dump.
protected forbids deletion here; cleanable permits consideration, not proof of disuse/safety.
Keep at least one copy and all protected copies. Suggest a keeper only when shown locations support it;
otherwise explain the user's choice based on which locations remain needed.
No contents, software inventory, usage history or backup evidence is supplied.
A .dmg may hold personal data: installer-like names do not verify contents. Qualify contents and impact;
only a confirmed installer-only copy leaves an installed app unchanged when deleted.
Deleting copies does not uninstall software; prefer uninstallation for removing an entire app.
Deletion permanently removes this path without sending it to the recycle bin; no recovery,
guaranteed reclaimed logical size or no-impact promise.
'''

